function emptyState(title, body, withBtn) {
  return `<div class="empty"><h2>${esc(title)}</h2><p>${esc(body)}</p>${withBtn && !S.readOnly ? `<button class="btn primary" type="button" data-act="post">Post a trip</button>` : ""}</div>`;

function groupByMonth(list, rowOpts) {
  const groups = new Map();
  list.forEach((t) => { const k = t.date.slice(0, 7); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(t); });
  return [...groups].map(([k, ts]) => `<div class="group">
      <div class="group-h"><h2>${esc(monthLabel(k))}</h2><span>${ts.length} ${ts.length === 1 ? "trip" : "trips"}</span></div>
      <ul class="rows">${ts.map((t) => tripRow(t, rowOpts)).join("")}</ul></div>`).join("");
}

function renderCalendar() {
  if (!S.cal) { const d = parseD(todayStr()); S.cal = { y: d.getFullYear(), m: d.getMonth() }; }
  const { y, m } = S.cal;
  $("#cal-title").textContent = new Date(y, m, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });
  const first = new Date(y, m, 1), start = new Date(y, m, 1 - first.getDay());
  const t0 = todayStr();
  const byDay = new Map();
  S.trips.forEach((t) => { if (!passes(t)) return; if (!byDay.has(t.date)) byDay.set(t.date, []); byDay.get(t.date).push(t); });
  byDay.forEach((a) => a.sort(byWhen));
  let html = "";
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const ds = ymd(d), ts = byDay.get(ds) || [];
    const cls = ["cell", d.getMonth() !== m ? "out" : "", ds === t0 ? "today" : "", ds === S.calSel ? "sel" : ""].join(" ");
    const label = d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" }) + (ts.length ? `, ${ts.length} ${ts.length === 1 ? "trip" : "trips"}` : "");
    html += `<button class="${cls}" type="button" data-day="${ds}" aria-label="${esc(label)}">
      <span class="cnum">${d.getDate()}</span>
      ${ts.slice(0, 3).map((t) => `<span class="cchip ${t.kind === "hunt" ? "hunt" : "fish"} ${t.canceled ? "canceled" : ""}">${esc((t.time ? fmtTime(t.time).replace(":00", "").replace(" ", "").toLowerCase() + " " : "") + tripTitle(t))}</span>`).join("")}
      ${ts.length > 3 ? `<span class="cchip more">+${ts.length - 3} more</span>` : ""}
      <span class="cdots">${ts.slice(0, 4).map((t) => `<i class="${t.kind === "hunt" ? "hunt" : "fish"}"></i>`).join("")}</span>
    </button>`;
  }
  $("#cal-cells").innerHTML = html;
  const sel = S.calSel || t0;
  const ts = byDay.get(sel) || [];
  $("#cal-day").innerHTML = `<div class="day-panel-h"><h3>${esc(fmtD(sel, { weekday: "long", month: "long", day: "numeric" }))}</h3>${!S.readOnly ? `<button class="btn ghost small" type="button" data-act="post-day" data-day="${sel}">Post a trip this day</button>` : ""}</div>`
    + (ts.length ? `<ul class="rows">${ts.map((t) => tripRow(t, { reports: sel < t0 })).join("")}</ul>` : `<p class="muted">No trips this day.</p>`);
}
function hotFlies() {
  const cutoff = addDays(todayStr(), -120), tally = new Map();
  S.reports.forEach((r) => {
    const t = S.trips.get(r.tripId);
    if (!t || t.kind !== "fish" || t.date < cutoff || !r.worked) return;
    String(r.worked).split(/[,;\n]+/).map((s) => s.trim()).filter((s) => s && s.length <= 40).forEach((name) => {
      const k = name.toLowerCase();
      const cur = tally.get(k) || { name, n: 0 }; cur.n++; tally.set(k, cur);
    });
  });
  return [...tally.values()].sort((a, b) => b.n - a.n || a.name.localeCompare(b.name)).slice(0, 10);
}
function renderLogbook() {
  const el = $("#v-logbook");
  if (!S.loaded.trips) { el.innerHTML = `<p class="loading">Loading the logbook…</p>`; return; }
  const t0 = todayStr();
  const past = [...S.trips.values()].filter((t) => t.date < t0 && !t.canceled && passes(t)).sort((a, b) => byWhen(b, a));
  let top = "";
  if (kinds() !== "hunt") {
    const flies = hotFlies();
    top = `<div class="flies-card">
      <h2>Flies that worked lately</h2>
      ${flies.length
        ? `<div class="flylist">${flies.map((f) => `<span class="fly">${esc(f.name)}${f.n > 1 ? ` <b>×${f.n}</b>` : ""}</span>`).join("")}</div>`
        : `<p class="muted">Pulled from this club's fishing reports over the last four months. Add a report after your next trip and the flies show up here.</p>`}
      <p class="hint">Planning the next one? <button class="linkbtn" type="button" data-act="tab-flies">Open the Fly Picker</button> for what's hatching.</p>
    </div>`;
  }
  el.innerHTML = top + (past.length
    ? groupByMonth(past, { reports: true })
    : `<div style="margin-top:${top ? "18px" : "0"}">${emptyState("No past trips yet", "Trips land here the day after they happen. Anyone who went can add a report.", false)}</div>`);
}

/* ---------- Fly Picker tab ---------- */
const fpDefaults = () => ({ region: (club() && club().region) || "south", water_type: "freestone", date: todayStr() });
function ensureFlyPicker() {
  if (S.fp) return S.fp;
  if (typeof startFlyPicker !== "function") return null;
  const host = $("#fp-host"), tpl = $("#fp-tpl");
  if (!host || !tpl) return null;
  try {
    const root = host.shadowRoot || host.attachShadow({ mode: "open" });
    root.appendChild(tpl.content.cloneNode(true));
    S.fp = startFlyPicker(root, fpDefaults());
    S.fpClub = S.clubId;
  } catch (e) { console.error(e); S.fp = null; }
  return S.fp;
}
function flyRiverFor(t) {
  if (typeof DATA === "undefined" || !DATA.rivers) return null;
  const c = club();
  const txt = ((t.water || "") + " " + (t.title || "")).toLowerCase();
  for (const [id, r] of Object.entries(DATA.rivers)) {
    if (c && r.region !== c.region) continue;
    const base = String(r.name).toLowerCase().replace(/\s+river$/, "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    if (new RegExp("\\b" + base + "\\b").test(txt)) return id;
  }
  return null;
}
function renderFliesTab() {
  const fp = ensureFlyPicker();
  const note = $("#fp-note");
  if (!fp) { note.hidden = false; note.textContent = "The Fly Picker didn't load. Reload the page to try again."; return; }
  if (S.fpClub !== S.clubId) { S.fpClub = S.clubId; fp.set({ river: "", region: club().region, date: todayStr() }); }
  note.hidden = !S.fpNote;
  if (S.fpNote) note.innerHTML = `<span>${esc(S.fpNote)}</span><button class="btn ghost small" type="button" data-act="fp-dismiss">Dismiss</button>`;
}
function openFliesForTrip(t) {
  closeSheet();
  const fp = ensureFlyPicker();
  if (!fp) { toast("The Fly Picker didn't load. Reload the page."); return; }
  const c = club(), river = flyRiverFor(t);
  const d = fmtD(t.date, { weekday: "short", month: "short", day: "numeric" });
  S.fpClub = S.clubId;
  if (river) { fp.set({ river, date: t.date }); S.fpNote = `Set to the ${DATA.rivers[river].name} for ${d}, from ${tripTitle(t)}.`; }
  else { fp.set({ river: "", region: c.region, date: t.date }); S.fpNote = `Set to ${FP_REGION[c.region]} waters for ${d}. Pick the water type that matches ${t.water || "where you're going"}.`; }
  S.tab = "flies"; setHash(); scheduleRender();
  window.scrollTo(0, 0);
}

function gcalUrl(t) {
  const d = t.date.replace(/-/g, "");
  let dates;
  if (t.time) {
    const [h, m] = t.time.split(":").map(Number);
    let eh = h + 5, endD = d;
    if (eh >= 24) { eh -= 24; endD = addDays(t.date, 1).replace(/-/g, ""); }
    const hm = (H) => String(H).padStart(2, "0") + String(m).padStart(2, "0") + "00";
    dates = `${d}T${hm(h)}/${endD}T${hm(eh)}`;
  } else dates = `${d}/${addDays(t.date, 1).replace(/-/g, "")}`;
  const k = t.kind === "hunt" ? "hunt" : "fish";
  const details = [t.meet ? "Meet at: " + t.meet : "", t.cond ? COND_LABEL[k] + ": " + t.cond : "", t.notes || "", (club() ? club().name : "Anglers Club") + ": " + tripLink(t)].filter(Boolean).join("\n");
  const p = new URLSearchParams({ action: "TEMPLATE", text: `${KIND[k]}: ${tripTitle(t)}`, dates, ctz: tz(), location: t.water || "", details });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}
function chatText(t) {
  const R = rsvpsFor(t);
  const k = t.kind === "hunt" ? "hunt" : "fish";
  return [
    `${KIND[k]}: ${tripTitle(t)}${t.title && t.water ? " (" + t.water + ")" : ""}`,
    `${fmtD(t.date, { weekday: "short", month: "short", day: "numeric" })}${t.time ? " at " + fmtTime(t.time) : ""}`,
    t.meet ? `Meet: ${t.meet}` : "",

    `RSVP here: ${tripLink(t)}`,
  ].filter(Boolean).join("\n");
}

  });
  form.addEventListener("submit", async (e) => {

function readClubFields(form) {
  const f = (n) => form.elements.namedItem(n);
  const city = f("city").value.trim(), state = f("state").value;

  const sd = ST[state];
  const latRaw = f("lat").value.trim(), lonRaw = f("lon").value.trim();

  const kindsV = (form.querySelector("input[name=kinds]:checked") || {}).value || "both";
  return { data: {

}

      <label>Name<input id="m-handle" maxlength="30" placeholder="${esc(S.profiles[S.me.id]?.name || "e.g. Hutch")}" value="${esc(h)}"></label>
      <div class="form-acts"><button class="btn primary" type="submit">Save name</button></div>
    </form>
    <section class="sh-sec"><h3>Invite people</h3>
      <p class="hint">Send the link and the club password. ${owner ? "The password isn't stored in readable form, so set a new one below if you've lost it." : "Ask the organizer if you don't have the password."}</p>
      <div class="tool-row"><button class="btn ghost small" type="button" data-act="copy-invite">Copy invite link</button></div>
      <div id="invite-out"></div>
    </section>
    <section class="sh-sec"><h3>Your other devices</h3>
      <p class="hint">Open this link on your phone or laptop to sign in there as you, without the password. Keep it to yourself.</p>
      <div class="tool-row"><button class="btn ghost small" type="button" data-act="copy-device">Copy my sign-in link</button></div>
      <div id="device-out"></div>
    </section>
    ${owner ? `<form class="f sh-sec" id="pw-form" autocomplete="off">
      <h3>Club password</h3>
      <p class="hint">${c.pwHash ? "Changing it keeps everyone who already joined." : "No password yet, so nobody can join. Set one to open the club."}</p>
      <label>New password<input id="p-pw" maxlength="60" required></label>
      <p class="err" id="p-err" aria-live="polite"></p>
      <div class="form-acts"><button class="btn primary" type="submit">${c.pwHash ? "Change password" : "Set password"}</button></div>
      <div id="pw-out"></div>
    </form>
    <form class="f sh-sec" id="club-form" autocomplete="off" novalidate>
      <h3>Club details</h3>
      ${clubFields(c, false)}
      <p class="err" id="c-err" aria-live="polite"></p>
      <div class="form-acts"><button class="btn primary" type="submit">Save details</button></div>
    </form>` : ""}
    <section class="sh-sec"><h3 id="mem-h">Members</h3><ul class="roster" id="mem-list"></ul></section>
    ${!owner ? `<section class="sh-sec"><div class="form-acts"><button class="btn danger" type="button" data-act="ask-leave">Leave club</button></div>
      <div class="confirm" id="leave-confirm" hidden>Leave ${esc(c.name)}? You'll need the password to rejoin. <button class="btn danger solid small" type="button" data-act="do-leave">Leave</button><button class="btn ghost small" type="button" data-act="no-leave">Stay</button></div></section>` : ""}
  </div>`;
}
function updateMembersList() {
  const ul = $("#mem-list"); if (!ul) return;
  const c = club(); if (!c) return;
  const owner = isClubOwner();
  const ms = [...S.members.entries()].sort((a, b) => (a[1].role === "owner" ? -1 : b[1].role === "owner" ? 1 : (a[1].at || 0) - (b[1].at || 0)));
  $("#mem-h").textContent = `Members (${ms.length})`;
  const pending = S.sheet && S.sheet.rm;
  ul.innerHTML = ms.map(([uid, m]) => `<li>${av(uid, "lg")}<span class="nm">${esc(who(uid) + youTag(uid))}</span>
      <small>${uid === c.ownerId ? "Organizer" : "Member"}</small>
      ${owner && uid !== S.me.id ? (pending === uid
        ? `<button class="rm" type="button" data-act="do-rm" data-uid="${esc(uid)}">Confirm remove</button>`
        : `<button class="rm" type="button" data-act="ask-rm" data-uid="${esc(uid)}">Remove</button>`) : ""}</li>`).join("");
}

/* ---------- events ---------- */
document.addEventListener("click", async (e) => {
  const tab = e.target.closest(".tab[data-tab]");
  if (tab) { goTab(tab.dataset.tab); return; }
  const f = e.target.closest("[data-filter]");
  if (f) { S.filter = f.dataset.filter; scheduleRender(); return; }
  const day = e.target.closest(".cell[data-day]");
  if (day) { S.calSel = day.dataset.day; renderCalendar(); return; }
  const trip = e.target.closest(".trip[data-trip]");
  if (trip) { openSheet("trip", { id: trip.dataset.trip }); return; }
  const cr = e.target.closest(".club-row[data-club]");
  if (cr) { enterClub(cr.dataset.club, { save: S.myClubs.includes(cr.dataset.club) }); return; }
  const r = e.target.closest("[data-rsvp]");
  if (r) { await setRsvp(r.dataset.rsvp); return; }
  if (e.target.closest("#post-btn")) { openSheet("form", {}); return; }
  if (e.target.closest("#start-btn")) { openSheet("new"); return; }
  if (e.target.closest("#home-btn")) { enterClub(null); return; }
  if (e.target.closest("#me-btn")) { openSheet("club"); return; }
  if (e.target.closest("#cal-prev")) { calShift(-1); return; }
  if (e.target.closest("#cal-next")) { calShift(1); return; }
  if (e.target.closest("#cal-today")) { const d = parseD(todayStr()); S.cal = { y: d.getFullYear(), m: d.getMonth() }; S.calSel = todayStr(); renderCalendar(); return; }
  const a = e.target.closest("[data-act]");
  if (!a) { if (e.target === dlg()) closeSheet(); return; }
  const act = a.dataset.act;
  const t = S.sheet && S.sheet.id ? S.trips.get(S.sheet.id) : null;
  switch (act) {
    case "close": closeSheet(); break;
    case "home": enterClub(null); break;
    case "post": openSheet("form", {}); break;
    case "post-day": openSheet("form", { day: a.dataset.day }); break;
    case "new-club": openSheet("new"); break;
    case "club": openSheet("club"); break;
    case "tab-flies": goTab("flies"); break;
    case "fp-dismiss": S.fpNote = ""; scheduleRender(); break;
    case "edit": openSheet("form", { id: a.dataset.trip }); break;
    case "back": openSheet("trip", { id: a.dataset.trip }); break;
    case "copy": if (t) copyText(chatText(t), $("#tv-tools"), "Copied. Paste it into the group chat."); break;
    case "flies-for-trip": if (t) openFliesForTrip(t); break;
    case "del-cm": await act("comment.delete", { id: a.dataset.cm }); break;
    case "toggle-cancel": if (t) { const ok = await act("trip.cancel", { id: t.id, canceled: !t.canceled }, t.canceled ? "Trip restored" : "Trip marked canceled"); if (ok) openSheet("trip", { id: t.id }); } break;
    case "ask-delete": $("#del-confirm").hidden = false; break;
    case "no-delete": $("#del-confirm").hidden = true; break;
    case "do-delete": if (t) await deleteTrip(t); break;
    case "copy-invite": { const c = club(); if (c) copyText(inviteText(c, ""), $("#invite-out"), "Invite link copied. Send the password with it."); break; }
    case "copy-device": { const sv = session(); if (sv) copyText(APP_URL + "#key-" + S.clubId + "." + sv.token, $("#device-out"), "Sign-in link copied. Open it on your other device."); break; }
    case "copy-announce": copyText($("#announce-text").value, $("#announce"), "Copied. Paste it into your group text."); break;
    case "done-announce": { const el = $("#announce"); if (el) el.remove(); if (S.sheet) S.sheet.justPosted = false; break; }
    case "copy-created": copyText($("#created-text").value, null, "Copied. Paste it into your group text."); break;
    case "copy-pw-invite": copyText(S.lastInvite, $("#pw-out"), "Copied. Paste it into your group text."); break;
    case "ask-leave": $("#leave-confirm").hidden = false; break;
    case "no-leave": $("#leave-confirm").hidden = true; break;
    case "do-leave": await leaveClub(); break;
    case "ask-rm": S.sheet.rm = a.dataset.uid; updateMembersList(); break;
    case "do-rm": { const uid = a.dataset.uid; S.sheet.rm = null; await act("member.remove", { id: uid }, "Member removed"); break; }
  }
});
dlg().addEventListener("cancel", (e) => { e.preventDefault(); closeSheet(); });
dlg().addEventListener("close", () => { S.sheet = null; });
$("#mine-toggle").addEventListener("change", (e) => { S.mine = e.target.checked; scheduleRender(); });

document.addEventListener("submit", async (e) => {
  const id = e.target.id;
  if (!["cm-form", "rep-form", "me-form", "gate-form", "new-form", "pw-form", "club-form"].includes(id)) return;
  e.preventDefault();
  const btn = e.target.querySelector("button[type=submit]");
  if (btn && btn.disabled) return;
  if (btn) btn.disabled = true;
  try {
    if (id === "cm-form") await submitComment();
    else if (id === "rep-form") await submitReport();
    else if (id === "me-form") await submitHandle();
    else if (id === "gate-form") await submitJoin();
    else if (id === "new-form") await submitNewClub(e.target);
    else if (id === "pw-form") await submitPassword();
    else if (id === "club-form") await submitClubDetails(e.target);
  } finally { if (btn && btn.isConnected) btn.disabled = false; }
});

async function submitComment() {
  const ta = $("#cm-text"), text = ta.value.trim(), t = S.sheet && S.trips.get(S.sheet.id);
  if (!text || !t) return;
  const ok = await act("comment.add", { tripId: t.id, text });
  if (ok) { const el = $("#cm-text"); if (el) el.value = ""; }
}
async function submitReport() {
  const t = S.sheet && S.trips.get(S.sheet.id); if (!t) return;
  const data = { tripId: t.id, worked: $("#r-worked").value.trim(), count: $("#r-count").value.trim(), cond: $("#r-cond").value.trim(), notes: $("#r-notes").value.trim() };
  if (!data.worked && data.count === "" && !data.cond && !data.notes) { toast("Add at least one detail to the report."); return; }
  await act("report.save", data, "Report saved");
}
async function submitHandle() {
  const handle = $("#m-handle").value.trim();
  const ok = await act("me.update", { handle }, handle ? "Name saved" : "Name cleared");
  if (ok) closeSheet();
}
async function submitJoin() {
  const c = club(); if (!c) return;
  const pw = $("#g-pw").value, err = $("#g-err");
  if (!pw.trim()) { err.textContent = "Enter the club password."; return; }
  try {
    const out = await api("join", { method: "POST", body: { club: c.id, password: pw, handle: $("#g-name").value.trim() } });
    S.sessions[c.id] = { memberId: out.session.memberId, token: out.session.token };
    saveSessions();
    toast("You're in. Welcome to " + c.name + ".");
    enterClub(c.id, { tab: S.tab });
  } catch (e) { err.textContent = e.message; }
}
async function submitNewClub(form) {
  const err = $("#n-err");
  const r = readClubFields(form);
  if (r.err) { err.textContent = r.err; r.focus && r.focus.focus(); return; }
  const pw = form.elements.namedItem("pw").value;
  if (pw.trim().length < 3) { err.textContent = "Pick a club password of at least 3 characters."; form.elements.namedItem("pw").focus(); return; }
  const dupe = [...S.clubs.values()].find((c) => c.state === r.data.state && c.city.trim().toLowerCase() === r.data.city.toLowerCase());
  const dupeKey = r.data.city.toLowerCase() + "|" + r.data.state;
  if (dupe && form.dataset.dupOk !== dupeKey) {
    form.dataset.dupOk = dupeKey;
    err.textContent = `There's already a ${dupe.name} in ${dupe.city}. Close this and join it from All clubs, or press Start club again to make a second one.`;
    return;
  }
  err.textContent = "";
  try {
    const out = await api("clubs", { method: "POST", body: { ...r.data, password: pw, handle: form.elements.namedItem("handle").value.trim() } });
    const c = normClub(out.club.id, out.club);
    S.clubs.set(c.id, c);
    S.sessions[c.id] = { memberId: out.session.memberId, token: out.session.token };
    saveSessions();
    enterClub(c.id);
    openSheet("created", { id: c.id, club: c, invite: inviteText(c, pw.trim()) });
    loadDirectory();
  } catch (e) { err.textContent = e.message; }
}
async function submitPassword() {
  const c = club(); if (!c || !isClubOwner()) return;
  const pw = $("#p-pw").value, err = $("#p-err");
  if (pw.trim().length < 3) { err.textContent = "Use at least 3 characters."; return; }
  err.textContent = "";
  const ok = await act("club.password", { password: pw }, "Password saved");
  if (!ok) return;
  S.lastInvite = inviteText(c, pw.trim());
  const input = $("#p-pw"); if (input) input.value = "";
  const out = $("#pw-out");
  if (out) out.innerHTML = `<div style="display:grid;gap:8px;margin-top:4px"><p class="hint">Invite text with the new password:</p><textarea class="copybox" rows="4" readonly aria-label="Invite text">${esc(S.lastInvite)}</textarea><div><button class="btn ghost small" type="button" data-act="copy-pw-invite">Copy invite</button></div></div>`;
}
async function submitClubDetails(form) {
  const c = club(); if (!c || !isClubOwner()) return;
  const r = readClubFields(form), err = $("#c-err");
  if (r.err) { err.textContent = r.err; r.focus && r.focus.focus(); return; }
  err.textContent = "";
  const ok = await act("club.update", r.data, "Club details saved");
  if (ok) loadDirectory();
}
async function leaveClub() {
  const c = club(); if (!c) return;
  const ok = await act("member.leave", {}, "You left " + c.name);
  if (!ok) return;
  delete S.sessions[c.id]; saveSessions();
  closeSheet();
  enterClub(null);
}
async function setRsvp(status) {
  const t = S.sheet && S.trips.get(S.sheet.id);
  if (!t || !S.me.id) return;
  const cur = myRsvp(t);
  if (status === "out" && !cur) { toast("Marked can't go"); return; }
  if (cur && cur.status === status) return;
  if (status === "in" && rsvpsFor(t).full) { toast("The seats are taken. Mark Maybe instead."); return; }
  await act("rsvp.set", { tripId: t.id, status }, status === "in" ? "You're in" : status === "maybe" ? "Marked maybe" : "Marked can't go");
}
async function deleteTrip(t) {
  closeSheet();
  await act("trip.delete", { id: t.id }, "Trip deleted");
}
async function copyText(text, fallbackEl, okMsg) {
  try { await navigator.clipboard.writeText(text); toast(okMsg); return; }
  catch (e) {
    if (!fallbackEl) { const box = $("#created-text"); if (box) { box.focus(); box.select(); } toast("Text selected. Copy it from there."); return; }
    let box = fallbackEl.querySelector(".copybox");
    if (!box) { box = document.createElement("textarea"); box.className = "copybox"; box.readOnly = true; box.rows = 5; box.setAttribute("aria-label", "Text to copy"); fallbackEl.appendChild(box); }
    box.value = text; box.focus(); box.select();
    toast("Text selected below. Copy it from there.");
  }
}
function calShift(n) { let { y, m } = S.cal; m += n; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } S.cal = { y, m }; renderCalendar(); }

/* ---------- data ---------- */
async function loadDirectory() {
  try {
    const out = await api("clubs");
    S.clubs = new Map(out.clubs.map((c) => [c.id, normClub(c.id, c)]));
    S.clubsLoaded = true; S.connected = true;
    if (S.clubId && !S.clubs.has(S.clubId)) { toast("That club isn't here anymore."); enterClub(null); }
  } catch (e) {
    if (!S.clubsLoaded) S.connected = false;
    else toast(e.message);
  }
  scheduleRender();
}
async function loadClub(cid) {
  if (!cid || !session(cid)) return;
  const seq = ++S.loadSeq;
  try {
    const out = await api("state?club=" + encodeURIComponent(cid), { auth: cid });
    if (S.clubId !== cid || seq !== S.loadSeq) return;
    const c = normClub(out.club.id, out.club);
    S.clubs.set(c.id, c);
    S.me = { id: out.me.id, role: out.me.role };
    if (S.sessions[cid] && S.sessions[cid].memberId !== out.me.id) { S.sessions[cid].memberId = out.me.id; saveSessions(); }
    S.members = new Map(out.members.map((m) => [m.id, { handle: m.handle, role: m.role, at: m.at }]));
    S.trips = new Map(out.trips.map((t) => [t.id, { ...t, seats: typeof t.seats === "number" ? t.seats : null, kind: t.kind === "hunt" ? "hunt" : "fish" }]));
    S.rsvps = out.rsvps; S.comments = out.comments; S.reports = out.reports;
    S.loaded = { trips: true, members: true };
    S.connected = true;
    scheduleRender();
  } catch (e) {
    if (S.clubId !== cid) return;
    if (e.status === 401) { signedOut(cid); toast(e.message); return; }
    if (!S.loaded.members) { S.connected = false; scheduleRender(); }
  }
}
// Keeps the open club current while the page is in view.
function startPolling() {
  clearInterval(S.poll);
  S.poll = setInterval(() => { if (document.visibilityState === "visible" && S.clubId) loadClub(S.clubId); }, 20000);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    if (S.clubId) loadClub(S.clubId); else loadDirectory();
  });
}

/* ---------- topo background ---------- */
// Hand-sketched contour rings around a few hills, with every fifth ring heavier (index contours),
// plus one faint river. Seeded, so the map is the same on every visit.
let topoSize = "";
function drawTopo() {
  const cv = $("#topo");
  if (!cv || !cv.getContext) return;
  const w = window.innerWidth, h = window.innerHeight;
  const key = w + "x" + Math.round(h / 140);
  if (key === topoSize) return;
  topoSize = key;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const g = cv.getContext("2d");
  if (!g) return;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  let seed = 20261018;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const cell = 360, cols = Math.max(2, Math.ceil(w / cell)), rows = Math.max(2, Math.ceil(h / cell));
  g.lineJoin = "round"; g.lineCap = "round";
  for (let cy = 0; cy < rows; cy++) for (let cx = 0; cx < cols; cx++) {
    if (rnd() < 0.18) continue;
    const hx = (cx + 0.25 + rnd() * 0.5) * (w / cols), hy = (cy + 0.25 + rnd() * 0.5) * (h / rows);
    const base = cell * (0.13 + rnd() * 0.12), rings = 6 + Math.floor(rnd() * 6);
    const ph = [rnd() * 6.3, rnd() * 6.3, rnd() * 6.3], am = [0.1 + rnd() * 0.1, 0.05 + rnd() * 0.06, 0.02 + rnd() * 0.03];
    const sx = 1 + rnd() * 0.5, sy = 0.75 + rnd() * 0.3;
    for (let k = 1; k <= rings; k++) {
      const R = base * (k / rings) * 1.7;
      g.beginPath();
      for (let a = 0; a <= Math.PI * 2 + 0.06; a += 0.06) {
        const f = 1 + am[0] * Math.sin(2 * a + ph[0] + k * 0.18) + am[1] * Math.sin(3 * a + ph[1] - k * 0.1) + am[2] * Math.sin(5 * a + ph[2] + k * 0.3);
        const x = hx + Math.cos(a) * R * f * sx, y = hy + Math.sin(a) * R * f * sy;
        if (a === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.closePath();
      const index = k % 5 === 0;
      g.strokeStyle = index ? "rgba(176,122,69,0.34)" : "rgba(176,122,69,0.18)";
      g.lineWidth = index ? 1.5 : 0.9;
      g.stroke();
    }
  }
  const riverPath = () => {
    g.beginPath();
    for (let y = -20; y <= h + 20; y += 8) {
      const x = w * 0.82 + Math.sin(y / 140) * 48 + Math.sin(y / 53 + 1.3) * 16;
      if (y === -20) g.moveTo(x, y); else g.lineTo(x, y);
    }
  };
  riverPath(); g.strokeStyle = "rgba(44,106,153,0.20)"; g.lineWidth = 7; g.stroke();
  riverPath(); g.strokeStyle = "rgba(245,243,232,0.9)"; g.lineWidth = 3; g.stroke();
}
let topoT = 0;
window.addEventListener("resize", () => { clearTimeout(topoT); topoT = setTimeout(drawTopo, 180); });

/* ---------- boot ---------- */
async function boot() {
  try { drawTopo(); } catch (e) { /* decoration only */ }
  loadSessions();
  const h = (location.hash || "").slice(1);
  let want = null, wantTab = null, wantTrip = null, m;
  if ((m = /^club-([a-z0-9-]{1,80})(?:\.(upcoming|calendar|logbook|flies))?$/.exec(h))) { want = m[1]; wantTab = m[2] || null; }
  else if ((m = /^trip-([a-z0-9-]{1,80})\.([a-z0-9]{1,40})$/.exec(h))) { want = m[1]; wantTrip = m[2]; }
  else if ((m = /^key-([a-z0-9-]{1,80})\.([A-Za-z0-9_-]{20,100})$/.exec(h))) {
    // A sign-in link from another device: keep the token, then drop it from the address bar.
    want = m[1];
    S.sessions[want] = { memberId: "", token: m[2] };
    saveSessions();
  }
  renderAll();
  await loadDirectory();
  S.booting = false;
  const last = lastClub();
  const start = want || (last && S.sessions[last] ? last : null);
  enterClub(start, { tab: wantTab });
  startPolling();
  if (wantTrip) {
    const tryOpen = (n) => {
      if (S.clubId === want && isMember() && S.trips.has(wantTrip)) openSheet("trip", { id: wantTrip });
      else if (n > 0) setTimeout(() => tryOpen(n - 1), 400);
    };
    tryOpen(20);
  }
}
boot();
})();
</script>
