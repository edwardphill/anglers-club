<template id="fp-tpl"><style>/* Light design only, whatever the device theme. */
:host{
  color-scheme:light;
  --bg:#EEF2EF; --panel:#FFFFFF; --ink:#1B2724; --muted:#5A6A64; --line:#D3DCD7; --field:#F7F9F7;
  --accent:#1F6670; --accent-ink:#FFFFFF; --accent-soft:#DDECEC; --on:#A6CFD2; --bad:#A3372B;
  --strong:#2F7A45; --strong-soft:#E1F0E4; --fair:#946010; --fair-soft:#F6EBD6; --weak:#6B7571; --weak-soft:#E8ECEA;
  --display:"Literata", Georgia, serif; --body:"Public Sans", system-ui, sans-serif; --mono:"IBM Plex Mono", ui-monospace, monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.fp-body{color:var(--ink);font:15px/1.55 var(--body)}
main{max-width:980px;margin:0 auto;display:grid;gap:20px}
h1,h2{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:clamp(1.8rem,4.5vw,2.4rem);font-weight:700}
h2{font-size:1.15rem;font-weight:700}
p{margin:0}
.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px}
.top p{color:var(--muted);max-width:60ch}
.engine{font:500 .72rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.layout{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.layout{grid-template-columns:minmax(0,1fr)}}
#f{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:14px}
@media (min-width:761px){#f{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}}
label,.lab{display:grid;gap:6px;font-weight:600;font-size:.85rem}
.lab>span,label>span{color:var(--muted);font-weight:600}
select,input[type=date],input[type=number],input[type=text],textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{resize:vertical}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{display:block;font-weight:500;font-size:.82rem;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--field);cursor:pointer;color:var(--ink)}
.seg input:checked+label{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
details{border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:600;font-size:.85rem;color:var(--accent)}
details[open]>div{display:grid;gap:12px;margin-top:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex;align-items:center;gap:8px;font-weight:500}
.go{font:600 .95rem var(--body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:11px;cursor:pointer}
.results{display:grid;gap:16px;min-width:0}
.summary{display:flex;flex-wrap:wrap;gap:6px 14px;font:.82rem/1.4 var(--mono);color:var(--muted)}
.summary b{color:var(--ink);font-weight:500}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:12px}
.eat{display:grid;gap:8px}
.eat div{display:grid;grid-template-columns:minmax(0,11rem) 1fr 3.2rem;align-items:center;gap:10px;font-size:.88rem}
.bar{height:8px;border-radius:4px;background:var(--weak-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.pct{font:.8rem var(--mono);text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
ol.flies{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.fly{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:2rem 1fr;gap:4px 12px}
.rank{font:500 1.05rem/1.3 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.fly-body{display:grid;gap:6px;min-width:0}
.fly-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.fly-name{font-family:var(--display);font-weight:700;font-size:1.08rem}
.size{font:.82rem var(--mono);color:var(--muted)}
.chip{font:500 .68rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill{font:600 .72rem/1 var(--body);padding:4px 8px;border-radius:999px}
.pill.strong{background:var(--strong-soft);color:var(--strong)}
.pill.fair{background:var(--fair-soft);color:var(--fair)}
.pill.long{background:var(--weak-soft);color:var(--weak)}
.why{color:var(--muted);font-size:.88rem}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.acts button{font:500 .8rem var(--body);background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
.acts button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.note{font-size:.85rem;color:var(--fair);background:var(--fair-soft);border-radius:8px;padding:10px 12px}
.empty{color:var(--muted)}
.foot{font-size:.8rem;color:var(--muted);max-width:70ch}
.order{font-size:.8rem;color:var(--muted);margin:0}
/* Hatching now */
.hatch{gap:14px}
.hatch-head{display:grid;gap:4px}
.sub{font:.82rem/1.4 var(--mono);color:var(--muted)}
.group{display:grid;gap:8px}
.group-label{font:500 .7rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rnotes{list-style:none;margin:0;padding:2px 0 2px 12px;border-left:3px solid var(--on);display:grid;gap:8px;font-size:.88rem}
.src{color:var(--muted);font-size:.78rem}
.src a{color:var(--accent)}
.cite-block{display:grid;gap:5px;padding:2px 0 2px 12px;border-left:3px solid var(--on)}
.cites{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:.85rem}
.cites q{font-style:italic}
.cites-more summary{font-size:.8rem;font-weight:500}
.cites-more{border-top:0;padding-top:0}
.cites-more[open] .cites{margin-top:4px}
.cites-none{font-size:.8rem;color:var(--muted);margin:0}
ul.hrows{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hrow{width:100%;text-align:left;font:inherit;color:inherit;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:5px;cursor:pointer}
@media (hover:hover){.hrow:hover{border-color:var(--on)}}
.hrow.compact{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:7px 12px}
.hrow.compact .htip{flex:1 1 18rem;color:var(--muted)}
.hrow.compact .hwarn{flex-basis:100%}
.hrow[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.hrow-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.hname{font-family:var(--display);font-weight:700;font-size:1rem}
.latin{font-family:var(--display);font-style:italic;font-weight:400;color:var(--muted);font-size:.86rem}
.hmeta{font:.76rem/1.45 var(--mono);color:var(--muted)}
.htip{font-size:.86rem;line-height:1.45}
.hwarn{font-size:.8rem;color:var(--fair)}
.hbar{display:block;height:4px;border-radius:2px;background:var(--weak-soft);overflow:hidden}
.hbar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.status{font:600 .68rem/1 var(--body);padding:4px 8px;border-radius:999px;white-space:nowrap}
.status.peak{background:var(--strong-soft);color:var(--strong)}
.status.starting{background:var(--accent-soft);color:var(--accent)}
.status.winding_down{background:var(--fair-soft);color:var(--fair)}
.status.hatching{background:var(--weak-soft);color:var(--ink)}
.next{font-size:.86rem;color:var(--muted)}
.next b{color:var(--ink);font-weight:600}
.more{justify-self:start;font:500 .8rem var(--body);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 11px;color:var(--ink);cursor:pointer}
@media (max-width:760px){ul.hrows.clip-phone>li:nth-child(n+4){display:none}}
@media (min-width:761px){ul.hrows.clip-desk>li:nth-child(n+6){display:none}.more.phone{display:none}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chart-wrap{overflow-x:auto}
table.chart{border-collapse:separate;border-spacing:3px 2px;font:.72rem var(--mono)}
table.chart th{font-weight:500;color:var(--muted);padding:0 2px;text-align:center}
table.chart th[scope=row]{text-align:left;font:500 .8rem var(--body);color:var(--ink);white-space:nowrap;position:sticky;left:0;background:var(--panel);padding-right:10px}
table.chart td{min-width:18px;height:14px;border-radius:3px;background:var(--weak-soft)}
table.chart td.on{background:var(--on)}
table.chart td.peak{background:var(--accent)}
table.chart th.now{color:var(--fair);font-weight:600}
table.chart td.now{box-shadow:inset 0 0 0 2px var(--fair)}
.filterbar{scroll-margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;font-size:.86rem;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 12px}
.filterbar button{font:500 .8rem var(--body);background:var(--panel);color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:4px 10px;cursor:pointer}
/* River requests */
.linkish{justify-self:start;font:500 .8rem var(--body);color:var(--accent);background:none;border:0;padding:0;margin-top:-6px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;width:min(520px,calc(100vw - 32px));max-height:calc(100dvh - 32px);color:var(--ink);background:var(--panel)}
dialog::backdrop{background:rgba(27,39,36,.35)}
#req-form{padding:20px;display:grid;gap:14px}
.hint{font-size:.86rem;color:var(--muted)}
.req-acts{display:flex;flex-wrap:wrap;gap:8px}
.ghost{font:600 .95rem var(--body);background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:11px 14px;cursor:pointer}
.msg{font-size:.85rem}
.msg.err{color:var(--bad)}
.msg.ok{color:var(--strong)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .35s ease}}

:host{display:block;color-scheme:light;
  --bg:#F5F3E8; --panel:#FCFAF4; --ink:#2B2721; --muted:#6B6253; --line:#C2B8A3; --field:#F5F3E8;
  --accent:#2C6A99; --accent-ink:#FFFFFF; --accent-soft:#DFEAF1; --on:#A9C7DC; --bad:#BF4128;
  --strong:#4C7A3F; --strong-soft:#E3ECD6; --fair:#94650F; --fair-soft:#F4E8CB; --weak:#6B6253; --weak-soft:#ECE7D8;
  --display:"IM Fell English","EB Garamond",Garamond,Georgia,serif;
  --body:"EB Garamond",Garamond,"Times New Roman",Georgia,serif;
  --mono:"IM Fell English","EB Garamond",Georgia,serif}
.fp-body{font-size:17px}
.fp-h{font-weight:400;font-size:clamp(1.6rem,4vw,1.9rem)}
main{max-width:none}
h1,h2{font-weight:400}
.card h2{font-style:italic;font-size:1.3rem}
#f,.card{border:1px solid var(--ink);border-radius:3px;box-shadow:0 0 0 3px var(--panel),0 0 0 4px var(--ink)}
.fly{border:1.5px solid var(--line);border-radius:3px}
.hrow{border-width:1.4px;border-radius:3px}
select,input[type=date],input[type=number],input[type=text],textarea{border-width:1.5px;border-radius:3px}
.go,.ghost{font-family:"IM Fell English SC","EB Garamond",Georgia,serif;font-weight:400;letter-spacing:.07em;font-size:1.05rem;border:1px solid var(--ink);border-radius:3px}
.seg label{font-family:var(--mono);font-size:.98rem;border-width:1.4px;border-radius:3px}
.chip,.engine,.status,.pill{font-family:var(--mono);font-size:.86rem;letter-spacing:.02em;text-transform:none}
.summary,.sub,.hmeta,.size,.rank,.pct{font-size:.95rem}
.rank{font-family:var(--display);font-weight:400;font-size:1.3rem;font-variant-numeric:lining-nums}
.fly-name,.hname{font-size:1.18rem;font-weight:400;font-style:italic}
.summary,.pct,.size,.hmeta{font-variant-numeric:lining-nums}
.rnotes,.cite-block{border-left-color:var(--accent)}
dialog{border:1.6px solid var(--ink)}
@media (min-width:761px){#f{top:calc(env(safe-area-inset-top,0px) + 66px)}}
.filterbar{scroll-margin-top:66px}
</style><div class="fp-body"><main>
  <div class="top">
    <div style="display:grid;gap:6px">
      <h2 class="fp-h">Fly Picker</h2>
      <p>Tell it where and when you're fishing. It shows what's hatching and ranks the flies most likely to get eaten.</p>
    </div>
    <span class="engine" id="engine">Hatch-chart rules</span>
  </div>

  <div class="layout">
    <form id="f" autocomplete="off">
      <label>River
        <select id="river" name="river"></select>
      </label>
      <button type="button" class="linkish" id="req-open">Don't see your river? Request it</button>
      <label>Region
        <select id="region" name="region"></select>
      </label>
      <label>Water
        <select id="water_type" name="water_type"></select>
      </label>
      <label>Date
        <input type="date" id="date" name="date">
      </label>
      <div class="lab"><span>Fly type</span>
        <div class="seg" id="fly_type"></div>
      </div>
      <details id="more">
        <summary>Conditions on the water</summary>
        <div>
          <label>Water temp (°F), blank for typical
            <input type="number" id="water_temp_f" name="water_temp_f" min="32" max="95" step="1" placeholder="e.g. 54">
          </label>
          <div class="lab"><span>Sky</span><div class="seg" id="sky"></div></div>
          <div class="lab"><span>Flow</span><div class="seg" id="flow"></div></div>
          <label class="check"><input type="checkbox" id="windy" name="windy"> Windy</label>
          <div id="live" hidden style="display:grid;gap:12px">
            <label>Spot name (optional)
              <input type="text" id="place" name="place" placeholder="e.g. Madison River near Ennis">
            </label>
            <div class="lab"><span>Coordinates for live gauge and weather (today only)</span>
              <div class="row2">
                <input type="number" id="lat" name="lat" step="any" placeholder="Latitude" aria-label="Latitude">
                <input type="number" id="lon" name="lon" step="any" placeholder="Longitude" aria-label="Longitude">
              </div>
            </div>
          </div>
        </div>
      </details>
      <button class="go" type="submit">Pick flies</button>
    </form>

    <section class="results" aria-live="polite">
      <div class="summary" id="summary"></div>
      <div id="notes"></div>
      <section class="card hatch" id="hatch" aria-labelledby="hatch-title"></section>
      <div class="card" id="eat-card" hidden>
        <h2>What they're probably eating</h2>
        <div class="eat" id="eat"></div>
      </div>
      <div class="filterbar" id="filterbar" hidden></div>
      <p class="order" id="order">Spread across foods and fly types, so one hatch can't fill the list.</p>
      <ol class="flies" id="flies"></ol>
      <p class="foot" id="foot"></p>
    </section>
  </div>
</main>

<dialog id="req" aria-labelledby="req-title">
  <form id="req-form" novalidate autocomplete="off">
    <h2 id="req-title">Request a river</h2>
    <p class="hint">Fill this in, copy it, and send it to Edward. He adds rivers to the River list by hand for now.</p>
    <label>River name
      <input type="text" name="river" maxlength="80" placeholder="e.g. Kennebec River">
    </label>
    <div class="row2">
      <label>State
        <select name="state"></select>
      </label>
      <label>Water type
        <select name="water"></select>
      </label>
    </div>
    <label>Stretch or access point
      <input type="text" name="stretch" maxlength="120" placeholder="Optional, e.g. below Wyman Dam">
    </label>
    <label>USGS gauge number
      <input type="text" name="gauge" inputmode="numeric" maxlength="15" placeholder="Optional, 8 to 15 digits">
    </label>
    <label>Notes
      <textarea name="notes" rows="3" maxlength="500" placeholder="Optional: target fish, fly shops, anything useful"></textarea>
    </label>
    <label id="req-out" hidden>Your request
      <textarea id="req-text" rows="7" readonly></textarea>
    </label>
    <p class="msg" id="req-msg" aria-live="polite"></p>
    <div class="req-acts">
      <button type="submit" class="go">Copy request</button>
      <button type="button" class="ghost" id="req-close">Close</button>
    </div>
  </form>
</dialog></div></template>
